[project]
name = "grid-down"
version = "0.1.0"
description = "Grid Down — an AI-written survival adventure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "httpx==0.28.1",
    "python-multipart==0.0.22",
    "watchfiles==1.1.1",
    "google-genai>=2.34.0",
    "sqlalchemy>=2.1.8",
    "psycopg[binary]>=3.3.8",
    "pillow>=13.0.0",
    "kokoro-onnx>=0.6.1",
]

[tool.uv]
exclude-newer = "14 days"
# workshop-connect is published by us; exempt from the rolling window.
# certifi 2026.10.19 drops the compromised emSign ECC Root CA - G3
# (GHSA-6q48-6c7w-9gw2); security exception to the rolling window.
exclude-newer-package = { workshop-connect = "2027-01-01T00:00:00Z", certifi = "2026-10-21T00:00:00Z" }
